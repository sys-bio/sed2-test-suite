name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # libsed2 is not on PyPI yet, so install the newest Python wheel attached to a release at
      # https://github.com/sys-bio/SED2/releases/ .  `gh release list` includes pre-releases (which
      # `gh release download` without a tag would skip), and sys-bio/SED2 is public, so the
      # workflow's own token is enough.
      # - name: Install libsed2 from PyPI
      #   run: pip install libsed2
      - name: Install libsed2 from the latest SED2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo sys-bio/SED2 --limit 1 --json tagName --jq '.[0].tagName')
          echo "Installing libsed2 wheel from sys-bio/SED2 release $tag"
          mkdir -p "$RUNNER_TEMP/libsed2"
          gh release download "$tag" --repo sys-bio/SED2 --pattern 'libsed2-*.whl' --dir "$RUNNER_TEMP/libsed2"
          pip install "$RUNNER_TEMP"/libsed2/libsed2-*.whl

      - name: Tests for the tools
        run: python -m pytest

      - name: Tag blocks are up to date
        run: python generate_tags.py --all --check

      - name: SBML files are up to date
        run: python -m sed2suite.make_inputs --all --check
        env:
          PYTHONPATH: tools

      - name: Validate every case
        run: python -m sed2suite.validate_suite
        env:
          PYTHONPATH: tools

      - name: The disagreement log is valid
        run: python -m sed2suite.disagreements --check
        env:
          PYTHONPATH: tools

      - name: Every element is covered or deferred on purpose
        run: python -m sed2suite.coverage --check
        env:
          PYTHONPATH: tools
