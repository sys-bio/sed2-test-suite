[project]
name = "sed2suite"
version = "0.1.0"
description = "Tools for the SED2 test suite: results reader/writer, comparison, settings and suite validation"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2", "h5py>=3.10", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
